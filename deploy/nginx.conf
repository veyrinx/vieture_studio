# Nginx reverse proxy cho VieTure Studio
# Sao chép vào /etc/nginx/sites-available/vieture-studio, đổi server_name thành tên miền của bạn,
# rồi: ln -s ../sites-available/vieture-studio /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Bật HTTPS: certbot --nginx -d example.com -d www.example.com

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 8m; # admin image uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
